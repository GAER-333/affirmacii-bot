<!DOCTYPE html>
<html lang="ru" data-time="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аффирмации</title>
<!-- SDK Telegram Mini Apps: даёт доступ к window.Telegram.WebApp (тема, облачное хранилище, вибро и т.д.) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<!-- Tone.js — проигрывает фоновую музыку (и генерирует запасную, если файла с музыкой нет) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Солнечная система (рисуется в solar.js) — фон всей верхней части экрана -->
<div class="hero"><canvas id="solar" aria-label="Солнечная система" role="img"></canvas></div>

<div class="wrap">

  <!-- Переключатель времени суток: плашка с «жидким» ползунком в стиле iOS -->
  <div class="seg" id="seg" role="tablist" aria-label="Время дня">
    <div class="seg-thumb" id="segThumb"></div>
    <button class="seg-btn" role="tab" data-time="morning">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M6.3 14.5a6 6 0 0 1 11.4 0M12 4v3M4.9 8.9l1.6 1.6M19.1 8.9l-1.6 1.6M7 21h10"/></svg>
      <span>Утро</span>
    </button>
    <button class="seg-btn" role="tab" data-time="day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <span>День</span>
    </button>
    <button class="seg-btn" role="tab" data-time="night">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span>Ночь</span>
    </button>
  </div>

  <!-- Место под солнечную систему: сама она лежит в фоне -->
  <div class="hero-space"></div>

  <h1 id="title">Спокойной ночи</h1>
  <p class="sub" id="subtitle"></p>

  <div class="card">
    <div class="card-row">
      <div class="status-label"><span class="dot" id="statusDot"></span><span id="statusText">Готово к старту</span></div>
    </div>
    <div class="card-row progress-row">
      <div class="progress-top">
        <span class="muted-label">Прогресс</span>
        <span class="value" id="progressLabel">— из 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="card-row">
      <span class="muted-label">Текущая</span>
      <span class="value current" id="currentLabel">—</span>
    </div>
  </div>

  <!-- Настройки звучания -->
  <div class="card">
    <div class="card-row">
      <label class="muted-label" for="voiceVolume">Голос</label>
      <div class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <input type="range" id="voiceVolume" min="0" max="100" step="1" value="100" aria-label="Громкость голоса">
      </div>
    </div>
    <div class="card-row">
      <label class="muted-label" for="musicVolume">Музыка</label>
      <div class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
        <input type="range" id="musicVolume" min="0" max="100" step="1" value="50" aria-label="Громкость музыки">
      </div>
    </div>
    <div class="card-row sleep-row">
      <span class="muted-label">Темп речи</span>
      <div class="chips" id="speedChips" role="group" aria-label="Темп речи">
        <button data-rate="0.8" aria-pressed="false">0.8×</button>
        <button data-rate="0.9" aria-pressed="false">0.9×</button>
        <button data-rate="1" aria-pressed="true">1×</button>
        <button data-rate="1.1" aria-pressed="false">1.1×</button>
      </div>
    </div>
    <div class="card-row sleep-row">
      <div class="sleep-top">
        <span class="muted-label">Таймер сна</span>
        <span class="sleep-left" id="sleepLeft"></span>
      </div>
      <div class="chips" id="sleepChips" role="group" aria-label="Таймер сна">
        <button data-min="0" aria-pressed="true">Выкл</button>
        <button data-min="10" aria-pressed="false">10 мин</button>
        <button data-min="20" aria-pressed="false">20 мин</button>
        <button data-min="30" aria-pressed="false">30 мин</button>
      </div>
    </div>
  </div>

  <div class="card" id="listCard"></div>

  <!-- Свои фразы -->
  <div class="row-add">
    <input id="phraseInput" placeholder="Своя фраза" maxlength="200" enterkeyhint="done" />
    <button id="addBtn" aria-label="Добавить фразу">+</button>
  </div>
  <div class="custom-note">
    <span>Свои фразы пока читает голос устройства</span>
    <button id="clearBtn" hidden>Удалить мои</button>
  </div>

  <!-- Панель плеера, закреплена внизу экрана -->
  <div class="player">
    <button class="player-side" id="prevBtn" aria-label="Предыдущая фраза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5.5v13L9 12z"/></svg>
    </button>
    <button id="playBtn"><span id="playIcon">▶</span><span id="playLabel">Слушать</span></button>
    <button class="player-side" id="nextBtn" aria-label="Следующая фраза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5.5v13L15 12z"/></svg>
    </button>
  </div>

  <p id="statusMsg"></p>
</div>

<script src="data.js"></script>
<script src="solar.js"></script>
<script src="app.js"></script>
</body>
</html>
