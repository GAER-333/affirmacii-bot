<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аффирмации</title>
<!-- SDK Telegram Mini Apps: даёт доступ к window.Telegram.WebApp (тема, облачное хранилище, вибро и т.д.) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<!-- Tone.js — библиотека для генерации фоновой музыки прямо в браузере -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="glow-ring" style="inset:0;"></div>
    <div class="glow-ring" style="inset:18px; animation-delay:1s;"></div>
    <div class="hero-core"><div class="hero-badge" id="heroBadge">✨</div></div>
  </div>

  <h1>Слова, которые хочется услышать снова</h1>
  <p class="sub">Добавьте свои аффирмации — приложение проговорит их под спокойную музыку.</p>

  <div class="row-add">
    <input id="phraseInput" placeholder="Впишите фразу" maxlength="200" />
    <button id="addBtn" aria-label="Добавить">+</button>
  </div>
  <p id="emptyHint" style="display:none;">Добавьте хотя бы одну фразу, чтобы начать</p>

  <div class="card">
    <div class="card-row">
      <div class="status-label"><span class="dot" id="statusDot"></span><span id="statusText">Готово к старту</span></div>
    </div>
    <div class="card-row">
      <span class="muted-label">Фраз в списке</span>
      <span style="font-weight:700;" id="countLabel">0</span>
    </div>
    <div class="card-row">
      <span class="muted-label">Текущая</span>
      <span style="font-weight:700; max-width:18ch; text-align:right;" id="currentLabel">—</span>
    </div>
  </div>

  <div class="card" id="listCard" style="display:none;"></div>

  <button id="playBtn" disabled><span id="playIcon">▶</span><span id="playLabel">Слушать</span></button>

  <div class="row-bottom">
    <select id="voiceSelect" style="display:none;"></select>
    <button id="clearBtn" style="display:none;">🗑 Очистить</button>
  </div>

  <p id="statusMsg"></p>
</div>

<script src="app.js"></script>
</body>
</html>
